# 入口: 3台のアプリへラウンドロビン。アプリはステートレス（セッションも DB）なので、振り分けは単純でよい。
global
  log stdout format raw local0
defaults
  log global
  mode http
  option httplog
  timeout connect 3s
  timeout client 60s
  timeout server 90s   # 検索の上限（QUERY_TIMEOUT_SECONDS）より長く
  timeout client-fin 5s
frontend skorimako
  bind :8080
  default_backend apps
backend apps
  balance roundrobin
  option httpchk GET /healthz
  http-check expect status 200
  default-server inter 2s fall 2 rise 2 on-marked-down shutdown-sessions
  server app1 app1:8080 check
  server app2 app2:8080 check
  server app3 app3:8080 check
# OTLP/gRPC（HTTP/2）。TCP のまま振り分ける（長くつなぎっぱなしになるので、振り分けは接続ごと）
frontend otlp_grpc
  mode tcp
  bind :4317
  default_backend grpc_apps
backend grpc_apps
  mode tcp
  balance roundrobin
  default-server inter 2s fall 2 rise 2
  server app1 app1:4317 check
  server app2 app2:4317 check
  server app3 app3:4317 check
frontend stats
  bind :8404
  stats enable
  stats uri /
