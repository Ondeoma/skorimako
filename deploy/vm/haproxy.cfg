# /etc/haproxy/haproxy.cfg（3台とも同じ）。VIP(10.0.0.10) は keepalived が持つ。
global
  log /dev/log local0
  maxconn 4096
defaults
  log global
  mode http
  option httplog
  timeout connect 3s
  timeout client 60s
  timeout server 90s   # 検索の上限（QUERY_TIMEOUT_SECONDS）より長く
  timeout tunnel 1h
frontend https
  bind :443 ssl crt /etc/haproxy/certs/skorimako.example.com.pem alpn h2,http/1.1
  bind :80
  http-request redirect scheme https unless { ssl_fc }
  http-request set-header X-Forwarded-Proto https
  default_backend skorimako
backend skorimako
  balance roundrobin          # ページの担当ノードへの振り分けはアプリが行う
  option httpchk GET /healthz
  http-check expect status 200
  default-server inter 2s fall 2 rise 2 on-marked-down shutdown-sessions
  server skorimako1 10.0.0.11:8080 check
  server skorimako2 10.0.0.12:8080 check
  server skorimako3 10.0.0.13:8080 check
# 観測データ（Parquet）の置き場所（各VMで動かす S3 互換ストレージを VIP:7480 にまとめる。外部のストレージを使うなら削除し、S3_ENDPOINT をそちらに向ける）
frontend s3
  bind 10.0.0.10:7480
  default_backend s3
backend s3
  balance leastconn
  option httpchk GET /
  server s3-1 10.0.0.11:8000 check
  server s3-2 10.0.0.12:8000 check
  server s3-3 10.0.0.13:8000 check
frontend stats
  bind 127.0.0.1:8404
  stats enable
  stats uri /

# OTLP/gRPC（HTTP/2）。TCP のまま振り分ける。TLS を終端するなら bind に ssl crt … alpn h2 を付け、backend は proto h2 にする
frontend otlp_grpc
  mode tcp
  bind :4317
  default_backend grpc_apps
backend grpc_apps
  mode tcp
  balance roundrobin
  default-server inter 2s fall 2 rise 2
  server obs1 10.0.0.11:4317 check
  server obs2 10.0.0.12:4317 check
  server obs3 10.0.0.13:4317 check
