name: skorimako-ha  # 開発用 docker-compose.dev.yml（プロジェクト名 skorimako）と衝突しないように
# 3ノード構成の試験環境（本番のVM 3台構成を1台のDocker上で再現する）。
#   etcd(1台) + Patroni/PostgreSQL(3台) + skorimakoアプリ(3台) + HAProxy + ScalaS3
# 使い方: scripts/ha-up.sh   （入口: http://localhost:8102 、HAProxy統計: http://localhost:8424）
# IdP なしで試せるよう DEV_LOGIN=true にしている（本番では OIDC_* を設定し DEV_LOGIN は付けない）。
# 本番では etcd も3台（各VMに1つ）、ScalaS3(1台) は冗長化した S3 互換ストレージ、HAProxy は各VM + keepalived(VIP)。
# 各アプリの DATA_DIR（取り込みの WAL）はノードごとのボリュームに置く（止まっても書き出す前の行を失わない）。
x-pg: &pg
  build: { context: ., dockerfile: deploy/docker/patroni.Dockerfile }
  image: skorimako-patroni:dev
  environment: &pgenv
    PATRONI_SCOPE: skorimako
    PATRONI_ETCD3_HOSTS: etcd:2379
    PATRONI_SUPERUSER_PASSWORD: postgres-secret
    PATRONI_REPLICATION_PASSWORD: replicator-secret
    SKORIMAKO_DB_PASSWORD: skorimako
  depends_on: [etcd]
x-app: &app
  build: { context: ., dockerfile: deploy/docker/app.Dockerfile }
  image: skorimako-app:dev
  environment: &appenv
    DATABASE_URL: jdbc:postgresql://pg1:5432,pg2:5432,pg3:5432/skorimako?targetServerType=primary&connectTimeout=3&tcpKeepAlive=true
    DATABASE_USER: skorimako
    DATABASE_PASSWORD: skorimako
    DEV_LOGIN: "true"
    APP_SECRET: ha-test-app-secret-0123456789
    PUBLIC_URL: http://localhost:8102
    ADMIN_GROUPS: skorimako-admins
    S3_ENDPOINT: http://s3:3900
    S3_BUCKET: skorimako
    S3_ACCESS_KEY: skorimako
    S3_SECRET_KEY: skorimakoskorimako
    FLUSH_SECONDS: ${HA_FLUSH_SECONDS:-5}
    DUCKDB_MEMORY: 512MB
  depends_on: [pg1, pg2, pg3, s3]
  restart: unless-stopped
services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.17
    command: >
      etcd --name etcd --data-dir /etcd-data
      --listen-client-urls http://0.0.0.0:2379 --advertise-client-urls http://etcd:2379
      --listen-peer-urls http://0.0.0.0:2380 --initial-advertise-peer-urls http://etcd:2380
      --initial-cluster etcd=http://etcd:2380 --enable-v2=false
  pg1:
    <<: *pg
    hostname: pg1
    environment: { <<: *pgenv, PATRONI_NAME: pg1, PATRONI_RESTAPI_CONNECT_ADDRESS: "pg1:8008", PATRONI_POSTGRESQL_CONNECT_ADDRESS: "pg1:5432" }
  pg2:
    <<: *pg
    hostname: pg2
    environment: { <<: *pgenv, PATRONI_NAME: pg2, PATRONI_RESTAPI_CONNECT_ADDRESS: "pg2:8008", PATRONI_POSTGRESQL_CONNECT_ADDRESS: "pg2:5432" }
  pg3:
    <<: *pg
    hostname: pg3
    environment: { <<: *pgenv, PATRONI_NAME: pg3, PATRONI_RESTAPI_CONNECT_ADDRESS: "pg3:8008", PATRONI_POSTGRESQL_CONNECT_ADDRESS: "pg3:5432" }
  app1:
    <<: *app
    environment: { <<: *appenv, NODE_ID: app1, NODE_URL: "http://app1:8080" }
    volumes: ["app1data:/var/lib/skorimako"]
  app2:
    <<: *app
    environment: { <<: *appenv, NODE_ID: app2, NODE_URL: "http://app2:8080" }
    volumes: ["app2data:/var/lib/skorimako"]
  app3:
    <<: *app
    environment: { <<: *appenv, NODE_ID: app3, NODE_URL: "http://app3:8080" }
    volumes: ["app3data:/var/lib/skorimako"]
  haproxy:
    image: haproxy:3.0-alpine
    volumes: ["./deploy/docker/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro"]
    ports: ["127.0.0.1:8102:8080", "127.0.0.1:8424:8404", "127.0.0.1:4327:4317"]
    depends_on: [app1, app2, app3]
  s3:
    build: { context: ./deploy/docker, dockerfile: scalas3.Dockerfile }
    image: skorimako-scalas3:dev
    environment: { SCALAS3_ACCESS_KEY: skorimako, SCALAS3_SECRET_KEY: skorimakoskorimako }
volumes:
  app1data:
  app2data:
  app3data:
