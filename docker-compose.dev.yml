# 開発用: PostgreSQL（本番は Patroni）と ScalaS3（S3 互換ストレージ）と Mailpit（送信メールを受け止めるだけの SMTP。http://localhost:8033 で中身を見られる）。
# 兄弟のサービスの開発環境と同時に動かせるよう、ポートをずらしている。開発用のパスワードなので、このマシンの中からだけつなぐ
name: skorimako
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: skorimako
      POSTGRES_PASSWORD: skorimako
      POSTGRES_DB: skorimako
    ports: ["127.0.0.1:54383:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/docker/dev-initdb.sql:/docker-entrypoint-initdb.d/10-skorimako-test.sql:ro   # テスト用DB skorimako_test
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "skorimako"]
      interval: 2s
      retries: 30
  s3:
    build: { context: ./deploy/docker, dockerfile: scalas3.Dockerfile }   # 初回はソースからビルドする
    image: skorimako-scalas3:dev
    environment:
      SCALAS3_ACCESS_KEY: skorimako
      SCALAS3_SECRET_KEY: skorimakoskorimako
    ports: ["127.0.0.1:3923:3900"]
    volumes: ["s3data:/var/lib/scalas3/data"]
  mail:
    image: axllent/mailpit:v1.27
    ports: ["127.0.0.1:1033:1025", "127.0.0.1:8033:8025"]
volumes:
  pgdata:
  s3data:
