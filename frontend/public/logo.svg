<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" role="img" aria-label="skorimako">
  <!-- 計器のグラフを抱えたコリマコ（korimako. ニュージーランドのベルバード. 鈴のような声でまわりの様子を知らせる）.
       台紙・芽・丸い頭・目は兄弟（stui・skea・skawau・skuaka・skaka）と同じ形 -->
  <rect width="160" height="160" rx="36" fill="#FFF4D6"/>
  <path d="M80 31q-12-13-4-27q14 7 4 27z" fill="#2E7D6B"/><path d="M80 31q13-10 21-4q-8 12-21 4z" fill="#3FA68C"/>
  <circle cx="80" cy="80" r="50" fill="#6E8B3D"/>
  <path d="M36 66q6-34 44-36q38 2 44 36q-18-16-44-16q-26 0-44 16z" fill="#4E6B8C" opacity=".75"/>
  <circle cx="66" cy="62" r="5" fill="#13202E"/><circle cx="67.5" cy="60.5" r="1.6" fill="#fff"/><circle cx="94" cy="62" r="5" fill="#13202E"/><circle cx="95.5" cy="60.5" r="1.6" fill="#fff"/>
  <ellipse cx="55" cy="75" rx="7" ry="4" fill="#F4A3A3"/><ellipse cx="105" cy="75" rx="7" ry="4" fill="#F4A3A3"/>
  <path d="M75 66q5-4 10 0l-5 11z" fill="#2A2F38"/>
  <!-- 鈴（ベルバードの声） -->
  <path d="M118 30a9 9 0 0 1 9 9v7l4 5h-26l4-5v-7a9 9 0 0 1 9-9z" fill="#F2B632"/><circle cx="118" cy="54" r="3" fill="#C98B12"/>
  <path d="M133 30q5 5 0 12M138 26q8 9 0 20" stroke="#F2B632" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- グラフの画面 -->
  <rect x="34" y="96" width="92" height="50" rx="9" fill="#fff" stroke="#D9CBB0" stroke-width="1.5"/>
  <path d="M44 132l14-12 12 7 14-18 12 9 16-12" stroke="#2563EB" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#9DB8E8"><rect x="44" y="137" width="6" height="4" rx="1"/><rect x="56" y="135" width="6" height="6" rx="1"/><rect x="68" y="136" width="6" height="5" rx="1"/><rect x="80" y="133" width="6" height="8" rx="1"/><rect x="92" y="135" width="6" height="6" rx="1"/><rect x="104" y="131" width="6" height="10" rx="1"/></g>
  <circle cx="98" cy="118" r="4" fill="#DC2626"/>
  <ellipse cx="40" cy="96" rx="9" ry="6" fill="#6E8B3D"/><ellipse cx="120" cy="96" rx="9" ry="6" fill="#6E8B3D"/>
</svg>
